[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macos-mdir-mom"
version = "0.1.0"
description = "MacOSMdir MOM — a Korean DOS-inspired terminal file manager"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=6,<9", "wcwidth>=0.2.13", "regex>=2024.0", "psutil>=6"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
m2 = "mom.cli:main"

[tool.setuptools.packages.find]
include = ["mom*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
